<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Basics Learning Page</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        h1 {
            color: #0066cc;
            text-align: center;
        }
        h2 {
            font-size: 18px;
            color: #444;
            margin-top: 0;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #004999;
        }
        input {
            padding: 6px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        ul {
            margin: 5px 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ChildComponent(props) {
            return (
                <div style={{ background: "#eef", padding: "10px", borderRadius: "4px" }}>
                    <p><strong>Child Component:</strong> Hello {props.name}! Message: "{props.message}"</p>
                </div>
            );
        }

        function App() {
            const [count, setCount] = useState(0);
            const [data, setData] = useState(null);
            const [inputValue, setInputValue] = useState('');
            const [submittedValue, setSubmittedValue] = useState('');
            const fruits = ['Apple', 'Banana', 'Cherry', 'Mango'];

            useEffect(() => {
                fetch('https://jsonplaceholder.typicode.com/todos/1')
                    .then(response => response.json())
                    .then(json => setData(json));
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmittedValue(inputValue);
            };

            return (
                <div className="container">
                    <h1>React Basic Concepts</h1>

                    <div className="card">
                        <h2>1. useState Hook (Counter)</h2>
                        <p>Count: {count}</p>
                        <button onClick={() => setCount(count + 1)}>Click Me</button>
                    </div>

                    <div className="card">
                        <h2>2. useEffect Hook (API Fetch)</h2>
                        {data ? <p>Fetched Todo Title: <strong>{data.title}</strong></p> : <p>Loading data...</p>}
                    </div>

                    <div className="card">
                        <h2>3. Props (Sharing Data)</h2>
                        <ChildComponent name="Student" message="Welcome to React!" />
                    </div>

                    <div className="card">
                        <h2>4. React Forms</h2>
                        <form onSubmit={handleSubmit}>
                            <input 
                                type="text" 
                                value={inputValue} 
                                onChange={(e) => setInputValue(e.target.value)} 
                                placeholder="Type your name"
                            />
                            <button type="submit">Submit</button>
                        </form>
                        {submittedValue && <p>You typed: <strong>{submittedValue}</strong></p>}
                    </div>

                    <div className="card">
                        <h2>5. Iterative Rendering using map()</h2>
                        <ul>
                            {fruits.map((fruit, index) => (
                                <li key={index}>{fruit}</li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
